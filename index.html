<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metroidvania Pixel-Mask Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 8px;
        }
        #game-container {
            position: relative;
            box-shadow: 0 12px 36px rgba(0,0,0,0.85);
            border: 2px solid #2d324d;
            border-radius: 8px;
            overflow: hidden;
            max-width: 100%;
            background: #000;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            width: 100%;
            height: auto;
            max-height: 60vh;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            text-shadow: 1px 1px 3px #000;
            font-size: 13px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Controles Touch na Tela para Dispositivos Móveis */
        #touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 640px;
            margin-top: 12px;
            padding: 0 16px;
        }
        .d-pad, .action-buttons {
            display: flex;
            gap: 12px;
        }
        .btn-touch {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            width: 58px;
            height: 58px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-touch:active {
            background: rgba(0, 210, 106, 0.4);
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="640" height="360"></canvas>
        <div id="ui-overlay">
            <div id="map-name">Mapa: Carregando...</div>
            <div id="pos-info">X: 0 | Y: 0</div>
            <div style="font-size: 11px; opacity: 0.8; margin-top: 3px;">
                Teclado: [A/D] Mover | [Espaço] Pular
            </div>
        </div>
    </div>

    <!-- Controles virtuais na tela para celular -->
    <div id="touch-controls">
        <div class="d-pad">
            <button class="btn-touch" id="btn-left">◀</button>
            <button class="btn-touch" id="btn-right">▶</button>
        </div>
        <div class="action-buttons">
            <button class="btn-touch" id="btn-jump" style="width: 66px; height: 66px; background: rgba(77, 166, 255, 0.25);">PULO</button>
        </div>
    </div>

    <script src="src/game.js"></script>
</body>
</html>
